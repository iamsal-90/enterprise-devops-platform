apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-nginx-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/iamsal-90/enterprise-devops-platform.git'
    targetRevision: develop
    path: 'gitops/apps/sample-app'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
